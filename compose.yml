services:
  checkout:
    build:
      context: .
      target: checkout
    container_name: checkout-service
    environment:
      - DATABASE_URL=http://database-stub:8080
      - PAYMENT_URL=http://payment-stub:8081
      - INVENTORY_URL=http://inventory-stub:8082
    ports:
      - "8083:8083"
    depends_on:
      database-stub:
        condition: service_healthy
      payment-stub:
        condition: service_healthy
      inventory-stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  integration-tests:
    build:
      context: .
      target: tests
    container_name: integration-tests
    environment:
      - DATABASE_URL=http://database-stub:8080
      - PAYMENT_URL=http://payment-stub:8081
      - INVENTORY_URL=http://inventory-stub:8082
      - CHECKOUT_URL=http://checkout:8083
    depends_on:
      database-stub:
        condition: service_healthy
      payment-stub:
        condition: service_healthy
      inventory-stub:
        condition: service_healthy
      checkout:
        condition: service_healthy
    networks:
      - app-network

  database-stub:
    build:
      context: .
      target: stubs
    container_name: database-stub
    environment:
      - STUB_TYPE=database
    ports:
      - "8080:8080"
    command: ["./bin/stub-services", "-main", "stubs.DatabaseStub"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  payment-stub:
    build:
      context: .
      target: stubs
    container_name: payment-stub
    ports:
      - "8081:8081"
    command: ["./bin/stub-services", "-main", "stubs.PaymentStub"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  inventory-stub:
    build:
      context: .
      target: stubs
    container_name: inventory-stub
    environment:
      - DATABASE_URL=http://database-stub:8080
    ports:
      - "8082:8082"
    command: ["./bin/stub-services", "-main", "stubs.InventoryStub"]
    depends_on:
      database-stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
