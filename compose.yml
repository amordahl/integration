services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_DB=ecommerce
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  database:
    build:
      context: .
      target: database
    container_name: database-service
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ecommerce
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  payment:
    build:
      context: .
      target: payment
    container_name: payment-service
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  inventory:
    build:
      context: .
      target: inventory
    container_name: inventory-service
    environment:
      - DATABASE_URL=http://database:8080
    ports:
      - "8082:8082"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  payment-driver:
    build:
      context: .
      target: drivers
    container_name: payment-driver
    environment:
      - PAYMENT_URL=http://payment:8081
    command: ["sbt", "drivers/runMain drivers.payment.main"]
    depends_on:
      payment:
        condition: service_healthy
    networks:
      - app-network

  database-driver:
    build:
      context: .
      target: drivers
    container_name: database-driver
    environment:
      - DATABASE_URL=http://database:8080
    command: ["sbt", "drivers/runMain drivers.database.main"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
